<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventura</title>
  <meta name="description" content="Lepení inventárních štítků a inventura majetku po místnostech – ZŠ Karla Hašlera Libčice.">
  <meta name="theme-color" content="#2A4B9B">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventura">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="login"><p class="muted">Načítám aplikaci…</p></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
  <script>
    // Pojistka: když se aplikace nespustí (např. překlep v js/config.js), ukaž chybu místo nekonečného načítání.
    (function () {
      var shown = false;
      function fail(msg) {
        if (shown || window.__appStarted) return;
        shown = true;
        var el = document.getElementById('app');
        el.innerHTML = '<main class="login"><div class="login-card"><div class="eyebrow">Chyba při spuštění</div>' +
          '<h1 class="title">Aplikace se nespustila</h1><p></p>' +
          '<p class="muted small">Nejčastěji jde o překlep v souboru js/config.js (chybějící uvozovka nebo čárka). ' +
          'Když je soubor v pořádku, zkontroluj připojení k internetu a obnov stránku.</p>' +
          '<button class="btn" onclick="location.reload()">Obnovit stránku</button></div></main>';
        el.querySelector('p').textContent = msg;
      }
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') fail('Nepodařilo se načíst soubor ' + (t.src || '') + '.');
        else if (e && e.message) fail(e.message + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ', řádek ' + e.lineno + ')' : ''));
      }, true);
      setTimeout(function () { fail('Spuštění trvá příliš dlouho.'); }, 20000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
